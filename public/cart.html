<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - ShopEase</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .cart-page {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 25px;
        }

        .cart-list {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-product-icon {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h3 {
            margin-bottom: 8px;
            color: #111827;
        }

        .cart-price {
            color: #4f46e5;
            font-weight: bold;
            font-size: 18px;
        }

        .remove-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .remove-btn:hover {
            background: #fecaca;
            box-shadow: none;
        }

        .summary {
            background: white;
            border-radius: 18px;
            padding: 28px;
            height: fit-content;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            position: sticky;
            top: 100px;
        }

        .summary h3 {
            font-size: 21px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            color: #6b7280;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 20px;
            font-size: 21px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            margin: 25px 0 10px;
            padding: 14px;
            font-size: 16px;
        }

        .continue-btn {
            width: 100%;
            background: #f3f4f6;
            color: #374151;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .empty-cart h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #6b7280;
        }

        .cart-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .clear-btn {
            background: transparent;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .clear-btn:hover {
            background: #fee2e2;
            box-shadow: none;
        }

        @media (max-width: 800px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }
        }

        @media (max-width: 500px) {
            .cart-item {
                flex-wrap: wrap;
            }

            .remove-btn {
                margin-left: 105px;
            }
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            🛍️ <span>ShopEase</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="orders.html">Orders</a>
            <a href="login.html">Login</a>

            <a href="cart.html" class="cart-link">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>
        </nav>

    </header>


    <!-- CART -->

    <main class="cart-page">

        <h2>Shopping Cart</h2>

        <div class="cart-layout">

            <div class="cart-list">

                <div id="cartItems"></div>

                <div class="cart-actions">
                    <button class="clear-btn" onclick="clearCart()">
                        🗑 Clear Cart
                    </button>
                </div>

            </div>


            <!-- SUMMARY -->

            <div class="summary">

                <h3>Order Summary</h3>

                <div class="summary-row">
                    <span>Items</span>
                    <span id="itemCount">0</span>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span>FREE</span>
                </div>

                <div class="summary-total">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>

                <button class="checkout-btn" onclick="placeOrder()">
                    🔒 Place Order
                </button>

                <button class="continue-btn" onclick="goHome()">
                    ← Continue Shopping
                </button>

            </div>

        </div>

    </main>


    <script>

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];


        function displayCart() {

            const cartItems =
                document.getElementById("cartItems");

            let total = 0;

            cartItems.innerHTML = "";


            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty-cart">

                        <div class="empty-cart-icon">
                            🛒
                        </div>

                        <h3>Your cart is empty</h3>

                        <p>
                            Looks like you haven't added anything yet.
                        </p>

                        <button onclick="goHome()">
                            Start Shopping
                        </button>

                    </div>
                `;

            } else {

                cart.forEach((product, index) => {

                    const price =
                        parseInt(
                            product.price
                                .toString()
                                .replace(/[^0-9]/g, "")
                        );

                    total += price;


                    let icon = "📦";

                    if (
                        product.name
                            .toLowerCase()
                            .includes("phone")
                    ) {
                        icon = "📱";
                    }

                    if (
                        product.name
                            .toLowerCase()
                            .includes("laptop")
                    ) {
                        icon = "💻";
                    }


                    cartItems.innerHTML += `

                        <div class="cart-item">

                            <div class="cart-product-icon">
                                ${icon}
                            </div>

                            <div class="cart-info">

                                <h3>
                                    ${product.name}
                                </h3>

                                <span class="cart-price">
                                    ₹${price}
                                </span>

                            </div>

                            <button
                                class="remove-btn"
                                onclick="removeItem(${index})"
                            >
                                Remove
                            </button>

                        </div>

                    `;

                });

            }


            document.getElementById("itemCount")
                .innerText = cart.length;

            document.getElementById("subtotal")
                .innerText = "₹" + total;

            document.getElementById("total")
                .innerText = "₹" + total;

            document.getElementById("cartCount")
                .innerText = cart.length;

        }


        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            displayCart();

        }


        function clearCart() {

            if (cart.length === 0) {
                return;
            }

            if (
                confirm("Are you sure you want to clear your cart?")
            ) {

                cart = [];

                localStorage.removeItem("cart");

                displayCart();

            }

        }


        function goHome() {

            window.location.href = "index.html";

        }


        async function placeOrder() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;
            }


            const user =
                JSON.parse(localStorage.getItem("user"));


            if (!user) {

                alert(
                    "Please login before placing the order."
                );

                window.location.href = "login.html";

                return;
            }


            let total = 0;


            cart.forEach(product => {

                total += parseInt(
                    product.price
                        .toString()
                        .replace(/[^0-9]/g, "")
                );

            });


            const response =
                await fetch("/orders", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        user_id: user.id,
                        total: total
                    })

                });


            const data =
                await response.json();


            alert(data.message);


            if (response.ok) {

                localStorage.removeItem("cart");

                cart = [];

                displayCart();

            }

        }


        displayCart();

    </script>

</body>

</html>
